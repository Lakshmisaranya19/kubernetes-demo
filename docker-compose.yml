services:  
  postgres:  
    image: postgres:13  
    container_name: gamehub-postgres  
    environment:  
      POSTGRES_DB: gamehub  
      POSTGRES_USER: user  
      POSTGRES_PASSWORD: password  
    ports:  
      - "5432:5432"  
    volumes:  
      - pgdata:/var/lib/postgresql/data  
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  
    healthcheck:  
      test: ["CMD-SHELL", "pg_isready -U user -d gamehub"]  
      interval: 5s  
      timeout: 5s  
      retries: 10  
  
  auth-service:  
    build: ./auth-service  
    container_name: auth-service  
    environment:  
      POSTGRES_HOST: postgres  
      POSTGRES_DB: gamehub  
      POSTGRES_USER: user  
      POSTGRES_PASSWORD: password  
    ports:  
      - "8080:8080"  
    depends_on:  
      postgres:  
        condition: service_healthy  
  
  game-service:  
    build: ./game-service  
    container_name: game-service  
    environment:  
      POSTGRES_HOST: postgres  
      POSTGRES_DB: gamehub  
      POSTGRES_USER: user  
      POSTGRES_PASSWORD: password  
    ports:  
      - "8081:8081"  
    depends_on:  
      postgres:  
        condition: service_healthy  
  
  frontend:  
    build: ./frontend  
    container_name: frontend  
    ports:  
      - "3000:80"   # change to "3000:80" if the frontend Dockerfile serves via nginx  
    depends_on:  
      - auth-service  
      - game-service  
  
volumes:  
  pgdata: